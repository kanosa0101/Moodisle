name: moodisle_app
description: 心晴屿 Moodisle —— 情绪即天气的陪伴式专注与待办收服（原创 IP）。
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  just_audio: ^0.9.46
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 小程序分支的编译实验工具；固定版本，避免上游更新改变构建结果。
  flutter_miniprogram: 0.3.2
  # 测试替身直接引用其接口（app/test/helpers/fake_just_audio_platform.dart）
  just_audio_platform_interface: ^4.6.0
  drift_dev: 2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/pets/anxious/
    - assets/pets/emo/
    - assets/pets/sloth/
    - assets/pets/burnout/
    - assets/pets/neikao/
    - assets/pets/chaos/
    - assets/pets/distract/
    - assets/pets/perfect/
    - assets/pets/fomo/
    - assets/pets/shy/
    - assets/island/
    - assets/maze/
    - assets/maze/foes/
    - assets/souvenirs/
    - assets/bosses/
    - assets/travel/
    - assets/postcards/
    - assets/landmarks/
    - assets/items/icons/
    - assets/ui/app_icon.png
    - assets/ui/tabs/
    - assets/ui/actions/
    - assets/ui/difficulty/
    - assets/ui/emotes/
    - assets/audio/
    - assets/ui/feedback/
    - assets/ui/sections/
  # 中文子集字体（tool/subset_font.py 生成，SIL OFL 1.0）：
  # 界面文本离线可用，不再依赖 fonts.gstatic.com 的运行时下载。
  # Bold 同时声明为 700/800/900，避免粗体字重匹配不到而走在线回退
  fonts:
    - family: MoodisleSans
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular-Subset.ttf
        - asset: assets/fonts/NotoSansSC-Bold-Subset.ttf
          weight: 700
        - asset: assets/fonts/NotoSansSC-Bold-Subset.ttf
          weight: 800
        - asset: assets/fonts/NotoSansSC-Bold-Subset.ttf
          weight: 900
