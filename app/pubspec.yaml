publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pets/anxious/
    - assets/pets/emo/
    - assets/pets/sloth/
    - assets/pets/burnout/
    - assets/pets/neikao/
    - assets/pets/chaos/
    - assets/pets/distract/
    - assets/pets/perfect/
    - assets/pets/fomo/
    - assets/pets/shy/
    - assets/island/
    - assets/maze/
    - assets/maze/foes/
    - assets/souvenirs/
    - assets/bosses/
    - assets/travel/
    - assets/postcards/
    - assets/landmarks/
    - assets/items/icons/
    - assets/ui/app_icon.png
    - assets/ui/tabs/
    - assets/ui/actions/
    - assets/ui/difficulty/
    - assets/ui/emotes/
    - assets/ui/feedback/
    - assets/ui/sections/
