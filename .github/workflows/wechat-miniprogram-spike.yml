name: WeChat Mini Program spike

on:
  workflow_dispatch:
    inputs:
      appid:
        description: "小程序 AppID（留空则用 WECHAT_APPID Secret，再退回 touristappid 游客模式）"
        required: false
        default: ""
  # Run once when this workflow first reaches the development branch.
  # Later app changes require an intentional manual run to limit build usage.
  push:
    branches:
      - feat/wechat-miniprogram
    paths:
      - .github/workflows/wechat-miniprogram-spike.yml

permissions:
  # prerelease 用于免认证分发 weapp 产物（本地微信开发者工具验收用）。
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # mp-flutter 0.3.2 构建硬校验 Flutter 3.41.x（更高速退出码 3），
      # 与仓库 3.47.5 基线不同：见 tool/check_platform_consistency.py 的按工作流映射。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Install Brotli
        run: |
          sudo apt-get update
          sudo apt-get install --yes brotli

      # 小程序包体硬限 30MB：构建前在临时 checkout 内原地瘦身（仓库资产不变）。
      - name: Shrink assets for Mini Program
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/weapp_asset_diet.py apply
          python3 tool/weapp_asset_diet.py check

      # 仓库 pubspec.lock 由 Flutter 3.47.5 生成（Dart 下限 3.12），
      # 与 3.41.9 的 Dart 3.11 无解；CI 内重解析。
      # 另摘掉 build_runner/drift_dev：analyzer ^14 需要 meta ^1.18.3，
      # 与 3.41.9 SDK 钉死的 meta 1.17.0 冲突；两者仅用于本地代码生成，
      # database.g.dart 已入库，weapp 构建不跑 codegen。
      - name: Trim dev codegen tools for Dart 3.11 resolution
        working-directory: app
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          p = Path('pubspec.yaml')
          text = p.read_text(encoding='utf-8')
          for line in ('  drift_dev: 2.35.1\n', '  build_runner: ^2.16.2\n'):
              assert line in text, f'missing: {line!r}'
              text = text.replace(line, '')
          p.write_text(text, encoding='utf-8')
          EOF

      - name: Resolve Flutter dependencies
        working-directory: app
        run: |
          set +e
          rm -f pubspec.lock
          flutter pub get > ../pub_get.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 50 ../pub_get.log | head -c 3600 | tr '\n' '|')
            echo "::error title=pub get failed (exit $code)::${msg:-no output}"
            exit "$code"
          fi

      - name: Check Mini Program toolchain
        working-directory: app
        run: dart run flutter_miniprogram doctor

      # 构建失败时把日志尾部经 workflow annotation 外显（免认证可读）。
      - name: Build WeChat Mini Program
        working-directory: app
        env:
          # 真机验收用真实 AppID：手动运行时填写输入，或配置 WECHAT_APPID Secret；
          # 默认退回游客模式 touristappid（仅开发者工具模拟器可用）。
          WEAPP_APPID: ${{ inputs.appid || secrets.WECHAT_APPID || 'touristappid' }}
        run: |
          set +e
          dart run flutter_miniprogram --appid "$WEAPP_APPID" --dart-define=MOODISLE_MP=1 > ../weapp_build.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 60 ../weapp_build.log | head -c 3600 | tr '\n' '|')
            echo "::error title=weapp build failed (exit $code)::${msg:-no output}"
            exit "$code"
          fi
          echo "::notice::built with appid $WEAPP_APPID"

      - name: Report package sizes
        run: |
          du -h -d 2 app/build/weapp | sort -h
          echo "::notice::$(du -k -d 2 app/build/weapp | sort -n | tail -15 | tr '\n' '|')"

      # 固定 prerelease 标签，产物 URL 可免认证直接下载（本地验收用）。
      - name: Publish weapp artifact to prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEAPP_APPID: ${{ inputs.appid || secrets.WECHAT_APPID || 'touristappid' }}
        run: |
          cd app/build && zip -qr weapp-spike.zip weapp && cd ../..
          gh release delete weapp-spike-latest --yes --cleanup-tag || true
          gh release create weapp-spike-latest app/build/weapp-spike.zip \
            --prerelease --title "weapp spike (auto)" \
            --notes "自动构建：${{ github.sha }}（appid $WEAPP_APPID，MOODISLE_MP=1）"

      - uses: actions/upload-artifact@v4
        with:
          name: moodisle-wechat-spike-${{ github.sha }}
          path: app/build/weapp/
          if-no-files-found: error
          retention-days: 7
