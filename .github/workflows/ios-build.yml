name: iOS Build

"on":
  workflow_dispatch:
    inputs:
      artifact:
        description: Build output
        required: true
        default: unsigned-app
        type: choice
        options:
          - unsigned-app
          - signed-ipa

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP_BUNDLE_ID: dev.moodisle.moodisleApp

    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        if: inputs.artifact == 'signed-ipa'
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            IOS_CERTIFICATE_BASE64 \
            IOS_CERTIFICATE_PASSWORD \
            IOS_KEYCHAIN_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Prepare Apple signing material
        if: inputs.artifact == 'signed-ipa'
        id: signing
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/moodisle-certificate.p12"
          profile_path="$RUNNER_TEMP/moodisle.mobileprovision"
          profile_plist="$RUNNER_TEMP/moodisle-profile.plist"
          entitlements_path="$RUNNER_TEMP/moodisle-entitlements.plist"
          keychain_path="$RUNNER_TEMP/moodisle-signing.keychain-db"

          python3 - "$certificate_path" "$profile_path" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(
              base64.b64decode(os.environ["IOS_CERTIFICATE_BASE64"], validate=True)
          )
          pathlib.Path(sys.argv[2]).write_bytes(
              base64.b64decode(
                  os.environ["IOS_PROVISIONING_PROFILE_BASE64"], validate=True
              )
          )
          PY

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$IOS_KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(python3 - \
            "$profile_plist" \
            "$entitlements_path" \
            "$APP_BUNDLE_ID" <<'PY'
          import plistlib
          import sys

          profile_path, entitlements_path, expected_bundle_id = sys.argv[1:]
          with open(profile_path, "rb") as source:
              profile = plistlib.load(source)

          team_id = profile["TeamIdentifier"][0]
          app_identifier = profile["Entitlements"]["application-identifier"]
          prefix = f"{team_id}."
          if not app_identifier.startswith(prefix):
              raise SystemExit("Provisioning profile has an invalid application identifier")
          bundle_id = app_identifier[len(prefix):]
          if bundle_id != expected_bundle_id:
              raise SystemExit(
                  f"Provisioning profile bundle ID {bundle_id!r} does not match "
                  f"{expected_bundle_id!r}"
              )

          with open(entitlements_path, "wb") as target:
              plistlib.dump(profile["Entitlements"], target)
          print(profile["UUID"])
          PY
          )"

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          cp "$profile_path" "$profiles_dir/$profile_uuid.mobileprovision"

          identity="$({ security find-identity -v -p codesigning "$keychain_path" || true; } \
            | sed -n 's/.*"\(.*\)"/\1/p' \
            | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No code-signing identity found in the supplied certificate" >&2
            exit 1
          fi
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "profile_path=$profile_path" >> "$GITHUB_OUTPUT"
          echo "entitlements_path=$entitlements_path" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS release once
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned app
        if: inputs.artifact == 'unsigned-app'
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            app/build/ios/iphoneos/Runner.app \
            "$RUNNER_TEMP/Moodisle-unsigned-app.zip"

      - name: Sign and package IPA
        if: inputs.artifact == 'signed-ipa'
        shell: bash
        run: |
          set -euo pipefail
          app_path="app/build/ios/iphoneos/Runner.app"
          identity="${{ steps.signing.outputs.identity }}"
          profile_path="${{ steps.signing.outputs.profile_path }}"
          entitlements_path="${{ steps.signing.outputs.entitlements_path }}"

          cp "$profile_path" "$app_path/embedded.mobileprovision"
          if [[ -d "$app_path/Frameworks" ]]; then
            while IFS= read -r -d '' item; do
              codesign --force --sign "$identity" --timestamp=none "$item"
            done < <(find "$app_path/Frameworks" -depth \
              \( -type d -name '*.framework' -o -type f -name '*.dylib' \) \
              -print0)
          fi
          codesign --force --sign "$identity" \
            --entitlements "$entitlements_path" \
            --timestamp=none \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          package_dir="$RUNNER_TEMP/moodisle-ipa"
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/Runner.app"
          (cd "$package_dir" && /usr/bin/zip -qry "$RUNNER_TEMP/Moodisle.ipa" Payload)

      - name: Upload unsigned app
        if: inputs.artifact == 'unsigned-app'
        uses: actions/upload-artifact@v4
        with:
          name: Moodisle-unsigned-iOS-app
          path: ${{ runner.temp }}/Moodisle-unsigned-app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload signed IPA
        if: inputs.artifact == 'signed-ipa'
        uses: actions/upload-artifact@v4
        with:
          name: Moodisle-signed-iOS-IPA
          path: ${{ runner.temp }}/Moodisle.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Remove temporary keychain
        if: always() && inputs.artifact == 'signed-ipa'
        shell: bash
        run: security delete-keychain "${{ steps.signing.outputs.keychain_path }}" || true
