name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Static analysis
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Tests
        working-directory: app
        run: flutter test

      - name: Asset pipeline validation
        run: |
          python -m pip install --quiet pillow
          python tool/asset_pipeline.py validate

      - name: Clean-room banned-word scan
        run: python tool/ip_scan.py .

      - name: Per-asset ledger audit
        run: python tool/generate_ledger_per_asset.py audit
