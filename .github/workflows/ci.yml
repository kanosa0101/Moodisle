name: CI

on:
  push:
    branches: [main, feat/wechat-miniprogram]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Static analysis
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Tests
        working-directory: app
        run: flutter test

      - name: Mini Program capability flags
        working-directory: app
        run: |
          flutter test --dart-define=MOODISLE_MP=true --dart-define=EXPECTED_MP=true test/shared/platform_capabilities_test.dart
          flutter test --dart-define=MOODISLE_MP=1 --dart-define=EXPECTED_MP=true test/shared/platform_capabilities_test.dart

      - name: Build shared Web app
        working-directory: app
        run: flutter build web --release --pwa-strategy=none

      - uses: actions/upload-artifact@v4
        with:
          name: moodisle-web-${{ github.sha }}
          path: app/build/web/
          retention-days: 7

      - name: Maze performance budget
        working-directory: app
        run: dart run benchmark/maze_benchmark.dart

      - name: Ledger tool tests
        run: |
          python -m pip install --quiet pillow
          python -m unittest tool.test_generate_ledger_per_asset tool.test_weapp_asset_diet

      - name: Asset pipeline validation
        run: |
          python -m pip install --quiet pillow
          python tool/asset_pipeline.py validate

      - name: Cross-platform consistency
        run: python tool/check_platform_consistency.py

      - name: Clean-room banned-word scan
        run: python tool/ip_scan.py .

      - name: Per-asset ledger audit
        run: python tool/generate_ledger_per_asset.py audit
